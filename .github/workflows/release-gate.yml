name: TDS GA7 Release Gate

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: "TDS identity: 24f3000211@ds.study.iitm.ac.in"
        run: echo "24f3000211@ds.study.iitm.ac.in"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -r vercel_latency/requirements.txt pytest httpx

      - name: Run release gate tests
        working-directory: vercel_latency
        run: pytest -q test_release_gate.py
