name: Playwright QA1

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: 24f3000211@ds.study.iitm.ac.in
        run: echo "Starting Playwright"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm init -y

      - run: npm install playwright

      - run: npx playwright install --with-deps chromium

      - run: node st2.js
