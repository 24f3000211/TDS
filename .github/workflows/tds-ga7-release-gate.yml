name: TDS GA7 Release Gate

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: none

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]

    steps:
      - name: TDS identity: 24f3000211@ds.study.iitm.ac.in
        run: echo "24f3000211@ds.study.iitm.ac.in"

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: python -m pip install -r release_gate/requirements.txt

      - name: Run release-gate tests
        working-directory: release_gate
        run: python -m pytest -q
